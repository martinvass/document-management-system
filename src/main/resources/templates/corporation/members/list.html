<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_header(title='DMS - Members', additionalLinks=~{this::page_links})}">
    <th:block th:fragment="page_links">
        <link rel="stylesheet" th:href="@{/css/components.css}">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
        <link rel="stylesheet" th:href="@{/css/home.css}">
    </th:block>
</head>
<body>

<nav th:replace="~{fragments/dashboard/navigation :: navigation_bar}"></nav>

<div th:if="${message}" th:replace="~{fragments/toasts-messages :: alert_success(message=${message})}"></div>
<div th:if="${error}"   th:replace="~{fragments/toasts-messages :: alert_error(message=${error})}"></div>

<div th:replace="~{fragments/dashboard/sidebar :: sidebar(content=~{::content})}">
    <div th:fragment="content">
        <div class="container-fluid py-4">
            <a th:href="@{/home}" class="btn btn-outline-secondary mb-4">
                <i class="fas fa-arrow-left me-1"></i> Back to Home
            </a>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-0">Team Members</h3>
                    <small class="text-muted">
                        Manage users in <span th:text="${activeProfile.corporation.name}">Corporation</span>
                    </small>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                            <h6 class="text-muted mb-1">Total Members</h6>
                            <h2 class="fw-bold text-primary mb-0" th:text="${membersCount}">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                            <h6 class="text-muted mb-1">Administrators</h6>
                            <h2 class="fw-bold text-danger mb-0" th:text="${adminsCount}">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                            <h6 class="text-muted mb-1">Employees</h6>
                            <h2 class="fw-bold text-success mb-0" th:text="${employeesCount}">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                            <h6 class="text-muted mb-1">Joined This Month</h6>
                            <h2 class="fw-bold text-info mb-0" th:text="${joinedThisMonthCount}">0</h2>
                        </div>
                    </div>
                </div>
            </div>

            <form method="get" th:action="@{/corporation/members}" class="mb-3">
                <div class="row g-2 align-items-end">
                    <div class="col-auto">
                        <select name="role"
                                class="form-select form-select-sm form-select-custom-sm">
                            <option value="">All Roles</option>
                            <option value="ADMIN" th:selected="${param.role != null and param.role[0] == 'ADMIN'}">Admin</option>
                            <option value="EMPLOYEE" th:selected="${param.role != null and param.role[0] == 'EMPLOYEE'}">Employee</option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <select name="departmentId"
                                class="form-select form-select-sm form-select-custom-md">
                            <option value="">All Departments</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}"
                                    th:selected="${param.departmentId != null and param.departmentId[0] == dept.id.toString()}">
                            </option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="fas fa-filter me-1"></i> Filter
                        </button>
                    </div>

                    <div class="col-auto">
                        <a th:href="@{/corporation/members}" class="btn btn-sm btn-outline-secondary">Clear</a>
                    </div>

                    <div class="search-wrapper ms-auto">
                        <i class="fas fa-search"></i>
                        <input type="text"
                               placeholder="Search by name or email..."
                               id="searchInput"
                               onkeyup="filterMembers()"/>
                    </div>
                </div>
            </form>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Departments</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="membersTableBody">
                        <tr th:each="member : ${members}"
                            th:attr="data-name=${member.user.profile.firstName + ' ' + member.user.profile.lastName}, data-email=${member.user.profile.email}">
                            <td>
                                <span th:text="${member.user.profile.firstName + ' ' + member.user.profile.lastName}">John Doe</span>
                            </td>
                            <td th:text="${member.user.profile.email}">john@example.com</td>
                            <td th:text="${member.user.profile.username}">johndoe</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${member.role.name() == 'ADMIN' ? 'bg-danger' : (member.role.name() == 'EMPLOYEE' ? 'bg-success' : 'bg-secondary')}"
                                      th:text="${member.role}">EMPLOYEE</span>
                            </td>
                            <td>
                                <span class="badge bg-info me-1" th:each="dept : ${member.departments}" th:text="${dept.name}">IT</span>
                                <span th:if="${#lists.isEmpty(member.departments)}" class="text-muted small">None</span>
                            </td>
                            <td th:text="${#dates.format(member.user.creationDate, 'yyyy-MM-dd')}">2025-01-15</td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:href="@{/corporation/members/{id}(id=${member.id})}"
                                       class="btn btn-sm btn-outline-secondary">
                                        <i class="fas fa-eye"></i> View
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(members)}">
                            <td colspan="7" class="text-center text-muted py-4">No members found.</td>
                        </tr>
                        </tbody>
                    </table>

                    <div th:replace="~{fragments/pagination :: pagination(
                                page=${members},
                                baseUrl='/corporation/members'
                            )}">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/table-filter.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initializeFilter(
            'searchInput',
            '#membersTableBody',
            'tr[data-name]',
            ['data-name', 'data-email']
        );
    });
</script>

<div th:replace="~{fragments/scripts :: footer_scripts}"></div>

</body>
</html>
